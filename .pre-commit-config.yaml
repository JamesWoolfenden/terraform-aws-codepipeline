---
# yamllint disable rule:line-length
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-json
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: pretty-format-json
        args:
          - --autofix
      - id: detect-aws-credentials
        args:
          - --allow-missing-credentials
      - id: detect-private-key
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: ad1b27d73581aa16cca06fc4a0761fc563ffe8e8 # v1.5.6
    hooks:
      - id: forbid-tabs
        exclude_types: [python, javascript, dtd, markdown, makefile, xml]
        exclude: binary|\.bin$
  - repo: https://github.com/jameswoolfenden/pre-commit-shell
    rev: cb16822cc2c347707ea076fd4ede0d483fbbab47 # v1.0.7
    hooks:
      - id: shell-lint
        exclude: template|\.template$
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: cbcdc463be5464e25e3e955a511599a67b9b987f # v0.50.0
    hooks:
      - id: markdownlint
  - repo: https://github.com/jameswoolfenden/pre-commit
    rev: c5bdf92051a9e574d62152d81a3bd98a71816dd3 # v0.1.62
    hooks:
      - id: terraform-fmt
      - id: tf2docs
  - repo: local
    hooks:
    -   id: holden
        name: holden
        description: Scan Terraform for security and best-practices issues with the locally installed holden CLI.
        entry: holden scan  --deep
        language: system
        pass_filenames: false
        files: \.tf$
        # pre-push, not pre-commit: a system hook resolves holden from $PATH,
        # and no CI runner has it. CI invokes `pre-commit run --all-files`,
        # whose default stage is pre-commit, so anything on that stage runs
        # there and fails with "Executable `holden` not found". pre-push still
        # gates every push from a machine that has holden installed, and is
        # skipped by the CI invocation.
        #
        # Requires `pre-commit install --hook-type pre-push` once per clone.
        stages: [pre-push]
  - repo: https://github.com/jameswoolfenden/pike
    rev: 716798c1e676a533c66d080573957b0d63610ca6 # v1.0.15
    hooks:
      - id: pike-docs-go
        args: ["readme", "-d", ".", "-i"]
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/jameswoolfenden/ghat
    rev: 995b7f2c3aef001969b7d8d84ebc82df8f9f5a87 # v0.1.53
    hooks:
      - id: ghat-go
      - id: ghat-go-sift
